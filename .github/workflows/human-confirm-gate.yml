name: Human Confirm Gate (2x externe Handy-Auth)

# Required-Status-Check: main/ascension duerfen nur gemergt werden, wenn ein
# Mensch in Echtzeit ZWEI unabhaengige externe Identitaeten bestaetigt hat —
# GitHub (PR-Review-Approval, ueblicherweise per GitHub-Mobile-App mit
# Passkey/Biometrie) und Google (dieser Check, gekippt durch ein
# Apps-Script-Web-App, das selbst Google-Sign-In erzwingt).
#
# Diese Workflow-Datei OEFFNET das Gate nur (pending Check-Run) und
# benachrichtigt per Telefon-Push. Sie kann den Check NIE selbst gruen
# schalten — das darf ausschliesslich der vom Operator selbst betriebene
# Apps-Script-Endpoint (siehe scripts/google_confirm_webapp/).
#
# Laermvermeidung (aendert die Schranke NICHT, nur ihre Lautstaerke):
#   - genau EIN Kommentar pro PR, der bei jedem Push aktualisiert wird
#     statt einen neuen anzulegen
#   - Entwuerfe werden uebersprungen; das Gate oeffnet bei "ready for review"
#   - Handy-Push nur beim Oeffnen/Wiederoeffnen/Ready, nicht bei jedem Push
#   - ueberholte Laeufe werden abgebrochen, wenn schnell nachgepusht wird
#
# Setup: docs/ops/HUMAN_CONFIRM_GATE.md

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, ascension]

permissions:
  contents: read
  checks: write
  pull-requests: write

# Bei mehreren Pushes kurz hintereinander zaehlt nur der letzte Stand.
concurrency:
  group: human-confirm-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  open-gate:
    runs-on: ubuntu-latest
    # Entwuerfe koennen ohnehin nicht gemergt werden — kein Gate, kein Laerm.
    # Sobald der PR auf "ready for review" geht, greift der Trigger oben.
    if: github.event.pull_request.draft == false
    steps:
      - name: Open pending human-confirm/google check
        id: open_check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'human-confirm/google',
              head_sha: context.payload.pull_request.head.sha,
              status: 'in_progress',
              output: {
                title: 'Warte auf Google-Bestaetigung',
                summary: 'Bleibt offen, bis der Operator ueber das Apps-Script-Gate (Google-Sign-In) bestaetigt. Link steht im PR-Kommentar.',
              },
            });
            core.setOutput('check_run_id', String(check.id));

      - name: Upsert confirm links as a single PR comment
        id: links
        uses: actions/github-script@v7
        env:
          GOOGLE_CONFIRM_BASE_URL: ${{ secrets.GOOGLE_CONFIRM_WEBAPP_URL }}
          CHECK_RUN_ID: ${{ steps.open_check.outputs.check_run_id }}
        with:
          script: |
            // Unsichtbarer Marker: macht den eigenen Kommentar wiederauffindbar,
            // damit pro PR genau einer existiert statt einer pro Push.
            const MARKER = '<!-- human-confirm-gate -->';

            const sha = context.payload.pull_request.head.sha;
            const prNumber = context.payload.pull_request.number;
            const baseUrl = process.env.GOOGLE_CONFIRM_BASE_URL;
            const checkRunId = process.env.CHECK_RUN_ID;
            const reviewUrl = `${context.payload.pull_request.html_url}/files`;
            const shortSha = sha.substring(0, 7);

            let body;
            let confirmUrl = '';

            if (!baseUrl) {
              // Fail-closed: der Check bleibt offen und blockiert den Merge.
              // Das ist Absicht — fehlende Einrichtung darf die Schranke nicht
              // stillschweigend oeffnen.
              body = [
                MARKER,
                '## 🔐 Merge-Freigabe — Einrichtung unvollstaendig',
                '',
                'Das Secret `GOOGLE_CONFIRM_WEBAPP_URL` ist in diesem Repository nicht',
                'gesetzt. Der Check `human-confirm/google` bleibt deshalb offen und',
                'blockiert den Merge — bewusst, damit fehlende Einrichtung die Schranke',
                'nicht aufmacht.',
                '',
                'Einrichtung: `docs/ops/HUMAN_CONFIRM_GATE.md`',
                '',
                `<sub>Stand: \`${shortSha}\` · dieser Kommentar wird bei jedem Push aktualisiert.</sub>`,
              ].join('\n');
            } else {
              confirmUrl = `${baseUrl}?owner=${context.repo.owner}&repo=${context.repo.repo}&sha=${sha}&check_run_id=${checkRunId}`;
              body = [
                MARKER,
                '## 🔐 Zwei-Faktor-Merge-Freigabe',
                '',
                'Dieser PR braucht **zwei unabhaengige Bestaetigungen vom Handy**, bevor Branch Protection den Merge zulaesst:',
                '',
                `1. **GitHub** — [Review + Approve](${reviewUrl}) (GitHub-Mobile-App, Passkey/Biometrie).`,
                `2. **Google** — [Bestaetigen](${confirmUrl}) (Google-Sign-In, nur der hinterlegte Account darf bestaetigen).`,
                '',
                'Automation (inkl. Claude) merged diesen PR nicht selbst — komplett extern.',
                '',
                `<sub>Bestaetigung gilt fuer \`${shortSha}\`. Jeder neue Push setzt sie zurueck und aktualisiert diesen Kommentar.</sub>`,
              ].join('\n');
            }

            // Bestehenden Gate-Kommentar suchen und aktualisieren; nur wenn es
            // keinen gibt, einen neuen anlegen.
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100 },
            );
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(MARKER),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

            core.setOutput('confirm_url', confirmUrl);
            core.setOutput('review_url', reviewUrl);

      - name: Phone push (best-effort, ehrlich ohne Fake-Erfolg)
        # Nur wenn der PR neu zur Freigabe ansteht — nicht bei jedem Folge-Push.
        # Wer waehrend der Arbeit zehnmal pusht, will nicht zehn Handy-Pushes.
        if: >-
          always() &&
          contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action)
        env:
          PHONE_NOTIFY_WEBHOOK_URL: ${{ secrets.PHONE_NOTIFY_WEBHOOK_URL }}
          PHONE_NOTIFY_TOKEN: ${{ secrets.PHONE_NOTIFY_TOKEN }}
          REVIEW_URL: ${{ steps.links.outputs.review_url }}
          CONFIRM_URL: ${{ steps.links.outputs.confirm_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "${PHONE_NOTIFY_WEBHOOK_URL:-}" ]; then
            echo "PHONE_NOTIFY_WEBHOOK_URL nicht gesetzt — nur PR-Kommentar, kein Push. Ehrlich, kein Fake-Erfolg."
            exit 0
          fi
          AUTH_HEADER=()
          if [ -n "${PHONE_NOTIFY_TOKEN:-}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${PHONE_NOTIFY_TOKEN}")
          fi
          ACTIONS="view, GitHub Review, ${REVIEW_URL}, clear=false"
          if [ -n "${CONFIRM_URL:-}" ]; then
            ACTIONS="${ACTIONS}; view, Google Bestaetigen, ${CONFIRM_URL}, clear=false"
          fi
          curl -sS -X POST "${PHONE_NOTIFY_WEBHOOK_URL}" \
            "${AUTH_HEADER[@]}" \
            -H "Title: 2FA-Merge-Freigabe" \
            -H "Priority: high" \
            -H "Tags: lock,closed_lock_with_key" \
            -H "Actions: ${ACTIONS}" \
            -d "PR: ${PR_TITLE}" \
            || echo "Phone-Push fehlgeschlagen (nicht fatal) — Kommentar im PR bleibt die verbindliche Quelle."
