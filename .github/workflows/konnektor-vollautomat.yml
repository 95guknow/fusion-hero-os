name: Konnektor-Vollautomat

# Vollautomatisierung aller Konnektoren:
#   laden bottom-up -> verarbeiten top-down -> Geister manifestiert ausgeben.
#
# Der Lauf ist bewusst IMMER Dry-Run: es werden keine Secrets in die Job-Umgebung
# gereicht, FUSION_KONNEKTOR_LIVE bleibt ungesetzt und --force-live wird nie
# gesetzt. Der Automat berichtet damit ueber den deklarierten Stand der
# Registries, er ruft keine fremden APIs auf.

on:
  schedule:
    # taeglich 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - konnektor_vollautomat.yaml
      - mesh_connectors.yaml
      - graph_api_connectors.yaml
      - llm_frameworks.yaml
      - control_instances.yaml
      - fusion_hero_os/core/konnektor_vollautomat.py
      - .github/workflows/konnektor-vollautomat.yml

permissions:
  contents: write

concurrency:
  group: konnektor-vollautomat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vollautomat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten
        run: python -m pip install --quiet pyyaml pytest

      - name: Direktiven-Tests
        run: python -m pytest tests/test_konnektor_vollautomat.py -q

      - name: Vollautomat (Dry-Run)
        run: python -m fusion_hero_os.core.konnektor_vollautomat

      - name: Report in die Job-Summary
        if: always()
        run: cat docs/ops/KONNEKTOR_VOLLAUTOMAT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Inhaltliche Aenderung feststellen
        id: diff
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, subprocess

          # generated_at/duration_sec aendern sich bei jedem Lauf. Ohne diese
          # Normalisierung wuerde der Automat jeden Tag einen leeren Commit
          # erzeugen, in dem nur der Zeitstempel wandert.
          VOLATIL = {"generated_at", "duration_sec"}
          pfad = "docs/ops/KONNEKTOR_VOLLAUTOMAT.latest.json"

          def norm(d):
              return {k: v for k, v in d.items() if k not in VOLATIL}

          neu = norm(json.loads(pathlib.Path(pfad).read_text(encoding="utf-8")))
          alt = subprocess.run(
              ["git", "show", f"HEAD:{pfad}"], capture_output=True, text=True
          )
          geaendert = True
          if alt.returncode == 0:
              try:
                  geaendert = norm(json.loads(alt.stdout)) != neu
              except json.JSONDecodeError:
                  geaendert = True
          print(f"geaendert={'true' if geaendert else 'false'}")
          PY

      - name: Report committen
        if: steps.diff.outputs.geaendert == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ops/KONNEKTOR_VOLLAUTOMAT.latest.json docs/ops/KONNEKTOR_VOLLAUTOMAT.md
          git commit -m "chore(ops): Konnektor-Vollautomat Report aktualisiert"
          git push
